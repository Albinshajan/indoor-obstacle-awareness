<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" width="760" height="900" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="900" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d4753"/>
    </marker>
  </defs>

  <!-- ============ OFFLINE ============ -->
  <text x="15" y="24" font-size="14" font-weight="bold" fill="#2a5d8f">OFFLINE — workstation and Colab</text>
  <g font-size="13" fill="#3d4753">
    <rect x="15" y="36" width="230" height="84" rx="3" fill="#eef1f5" stroke="#3d4753" stroke-width="1.5"/>
    <text x="27" y="58" font-size="15" font-weight="bold" fill="#151c25">Indoor corpus</text>
    <text x="27" y="80">Roboflow, 12 classes,</text>
    <text x="27" y="98">split by scene (§3.3)</text>

    <rect x="265" y="36" width="230" height="84" rx="3" fill="#eef1f5" stroke="#3d4753" stroke-width="1.5"/>
    <text x="277" y="58" font-size="15" font-weight="bold" fill="#151c25">Fine-tuning</text>
    <text x="277" y="80">YOLOv8n, YOLO11n, YOLO26n,</text>
    <text x="277" y="98">identical settings (§3.5.1)</text>

    <rect x="515" y="36" width="230" height="84" rx="3" fill="#eef1f5" stroke="#3d4753" stroke-width="1.5"/>
    <text x="527" y="58" font-size="15" font-weight="bold" fill="#151c25">Core ML export</text>
    <text x="527" y="80">.mlpackage, checked against</text>
    <text x="527" y="98">PyTorch output (§3.5.2)</text>

    <rect x="15" y="138" width="230" height="84" rx="3" fill="#eef1f5" stroke="#3d4753" stroke-width="1.5"/>
    <text x="27" y="160" font-size="15" font-weight="bold" fill="#151c25">Tape-measured set</text>
    <text x="27" y="182">102 frames, 0.5–4.5 m,</text>
    <text x="27" y="200">never trained on (§3.7.1)</text>

    <rect x="265" y="138" width="230" height="84" rx="3" fill="#eef1f5" stroke="#3d4753" stroke-width="1.5"/>
    <text x="277" y="160" font-size="15" font-weight="bold" fill="#151c25">Objective 2</text>
    <text x="277" y="182">LiDAR vs monocular depth</text>
    <text x="277" y="200">against the tape (§4.2)</text>

    <text x="515" y="160" fill="#3d4753">The chosen detector, YOLO26n,</text>
    <text x="515" y="178" fill="#3d4753">is bundled in the app; Objective 2</text>
    <text x="515" y="196" fill="#3d4753">selects LiDAR as the depth</text>
    <text x="515" y="214" fill="#3d4753">source (§3.8.1).</text>
  </g>
  <line x1="245" y1="78" x2="263" y2="78" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="495" y1="78" x2="513" y2="78" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="245" y1="180" x2="263" y2="180" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ ON DEVICE ============ -->
  <rect x="5" y="240" width="750" height="610" rx="4" fill="#f7f8fa" stroke="#c9d0d8" stroke-width="1"/>
  <text x="15" y="264" font-size="14" font-weight="bold" fill="#2a5d8f">ON DEVICE — iPhone 13 Pro Max, one ARKit frame per cycle, up to 30 Hz</text>

  <g font-size="13" fill="#3d4753">
    <rect x="15" y="280" width="340" height="78" rx="3" fill="#ffffff" stroke="#3d4753" stroke-width="1.5"/>
    <text x="27" y="302" font-size="15" font-weight="bold" fill="#151c25">ARKit frame</text>
    <text x="27" y="323">RGB 1920 × 1440, LiDAR depth 256 × 192,</text>
    <text x="27" y="341">per-pixel confidence</text>

    <rect x="15" y="376" width="340" height="78" rx="3" fill="#ffffff" stroke="#3d4753" stroke-width="1.5"/>
    <text x="27" y="398" font-size="15" font-weight="bold" fill="#151c25">capture <tspan font-weight="normal" font-size="13" fill="#74808e">4.06 ms</tspan></text>
    <text x="27" y="419">rotate the frame upright and render it</text>
    <text x="27" y="437">to a pixel buffer</text>

    <rect x="15" y="472" width="340" height="78" rx="3" fill="#ffffff" stroke="#3d4753" stroke-width="1.5"/>
    <text x="27" y="494" font-size="15" font-weight="bold" fill="#151c25">preprocess <tspan font-weight="normal" font-size="13" fill="#74808e">1.74 ms</tspan></text>
    <text x="27" y="515">letterbox to 640 × 640, aspect preserved</text>

    <rect x="15" y="568" width="340" height="78" rx="3" fill="#ffffff" stroke="#2a5d8f" stroke-width="2.4"/>
    <text x="27" y="590" font-size="15" font-weight="bold" fill="#151c25">detect <tspan font-weight="normal" font-size="13" fill="#74808e">6.41 ms</tspan></text>
    <text x="27" y="611">YOLO26n in Core ML on the Neural Engine,</text>
    <text x="27" y="629">confidence above 0.30</text>

    <rect x="15" y="664" width="340" height="78" rx="3" fill="#ffffff" stroke="#2a5d8f" stroke-width="2.4"/>
    <text x="27" y="686" font-size="15" font-weight="bold" fill="#151c25">depthSample <tspan font-weight="normal" font-size="13" fill="#74808e">1.05 ms</tspan></text>
    <text x="27" y="707">median LiDAR depth over each box's lower</text>
    <text x="27" y="725">third; low-confidence pixels dropped</text>
  </g>
  <line x1="185" y1="358" x2="185" y2="374" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="185" y1="454" x2="185" y2="470" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="185" y1="550" x2="185" y2="566" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="185" y1="646" x2="185" y2="662" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g font-size="13" fill="#3d4753">
    <rect x="405" y="280" width="340" height="192" rx="3" fill="#ffffff" stroke="#3d4753" stroke-width="1.5"/>
    <text x="417" y="302" font-size="15" font-weight="bold" fill="#151c25">Feedback (§3.8.3)</text>
    <text x="417" y="326">haptic: urgency → intensity,</text>
    <text x="417" y="344">sharpness and pulse rate</text>
    <text x="417" y="366">audio: pre-rendered earcons,</text>
    <text x="417" y="384">panned by bearing</text>
    <text x="417" y="406">speech: object identity, on a button</text>
    <text x="417" y="428">modes: audio, haptic, or both</text>
    <text x="417" y="456" fill="#74808e">audio mixes with VoiceOver</text>

    <rect x="405" y="550" width="340" height="192" rx="3" fill="#ffffff" stroke="#3d4753" stroke-width="1.5"/>
    <text x="417" y="572" font-size="15" font-weight="bold" fill="#151c25">Decision layer <tspan font-weight="normal" font-size="13" fill="#74808e">0.066 ms</tspan></text>
    <text x="417" y="596">track: IoU association and closing</text>
    <text x="417" y="614">rate over 0.6 s</text>
    <text x="417" y="636">features: distance, bearing, hazard,</text>
    <text x="417" y="654">time to contact</text>
    <text x="417" y="676">urgency score, Equation 3.6</text>
    <text x="417" y="698">gate: 3 of 5 frames, with hysteresis</text>
    <text x="417" y="726" fill="#74808e">§3.8.2</text>
  </g>
  <line x1="355" y1="703" x2="403" y2="703" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="575" y1="550" x2="575" y2="474" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g font-size="13" fill="#3d4753">
    <rect x="15" y="764" width="730" height="68" rx="3" fill="#eef1f5" stroke="#3d4753" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="27" y="786" font-size="15" font-weight="bold" fill="#151c25">LatencyLogger <tspan font-weight="normal" font-size="13" fill="#74808e">measurement only</tspan></text>
    <text x="27" y="808">per-stage timings, thermal state and the top detection for every frame, written to CSV</text>
  </g>

  <text x="15" y="872" font-size="12" fill="#74808e">Timings are means from the prototype's second live run (§4.3.3), 13.32 ms per frame in total.</text>
  <text x="15" y="890" font-size="12" fill="#74808e">Heavier outlines mark the two stages whose model or sensor Chapter 4 measures.</text>
</svg>
