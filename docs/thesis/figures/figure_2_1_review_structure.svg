<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" width="760" height="700" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="700" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d4753"/>
    </marker>
  </defs>

  <!-- corpus -->
  <rect x="140" y="14" width="480" height="86" rx="3" fill="#eef1f5" stroke="#3d4753" stroke-width="1.5"/>
  <text x="380" y="42" text-anchor="middle" font-size="18" font-weight="bold" fill="#151c25">Literature corpus — 14 sources</text>
  <text x="380" y="66" text-anchor="middle" font-size="14" fill="#3d4753">6 arXiv preprints · 6 journal articles · 2 conference papers</text>
  <text x="380" y="88" text-anchor="middle" font-size="13" fill="#74808e">search method §2.2 · classification Table 2.1</text>

  <line x1="380" y1="100" x2="380" y2="122" stroke="#3d4753" stroke-width="1.5"/>
  <line x1="98" y1="122" x2="662" y2="122" stroke="#3d4753" stroke-width="1.5"/>
  <line x1="98" y1="122" x2="98" y2="144" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="286" y1="122" x2="286" y2="144" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="474" y1="122" x2="474" y2="144" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="662" y1="122" x2="662" y2="144" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- domains -->
  <g font-size="14" fill="#3d4753">
    <rect x="12" y="148" width="172" height="104" rx="3" fill="#ffffff" stroke="#3d4753" stroke-width="1.5"/>
    <text x="24" y="170" font-size="13" font-weight="bold" fill="#2a5d8f">DOMAIN A §2.5.1</text>
    <text x="24" y="192" font-size="15" font-weight="bold" fill="#151c25">Object detection</text>
    <text x="24" y="214">for real-time assistive</text>
    <text x="24" y="232">systems</text>

    <rect x="200" y="148" width="172" height="104" rx="3" fill="#ffffff" stroke="#3d4753" stroke-width="1.5"/>
    <text x="212" y="170" font-size="13" font-weight="bold" fill="#2a5d8f">DOMAIN B §2.5.2</text>
    <text x="212" y="192" font-size="15" font-weight="bold" fill="#151c25">Distance and depth</text>
    <text x="212" y="214">estimation for obstacle</text>
    <text x="212" y="232">awareness</text>

    <rect x="388" y="148" width="172" height="104" rx="3" fill="#ffffff" stroke="#3d4753" stroke-width="1.5"/>
    <text x="400" y="170" font-size="13" font-weight="bold" fill="#2a5d8f">DOMAIN C §2.5.3</text>
    <text x="400" y="192" font-size="15" font-weight="bold" fill="#151c25">Feedback design</text>
    <text x="400" y="214">audio, haptic and</text>
    <text x="400" y="232">multimodal output</text>

    <rect x="576" y="148" width="172" height="104" rx="3" fill="#ffffff" stroke="#3d4753" stroke-width="1.5"/>
    <text x="588" y="170" font-size="13" font-weight="bold" fill="#2a5d8f">DOMAIN D §2.5.4</text>
    <text x="588" y="192" font-size="15" font-weight="bold" fill="#151c25">Evaluation</text>
    <text x="588" y="214">methodology and who</text>
    <text x="588" y="232">takes part</text>
  </g>

  <line x1="98" y1="252" x2="98" y2="274" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="286" y1="252" x2="286" y2="274" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="474" y1="252" x2="474" y2="274" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="662" y1="252" x2="662" y2="274" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- gaps -->
  <g font-size="14" fill="#3d4753">
    <rect x="12" y="278" width="172" height="126" rx="3" fill="#f7f8fa" stroke="#9aa4b0" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="24" y="300" font-size="13" font-weight="bold" fill="#b5541c">GAP</text>
    <text x="24" y="322">Accuracy, latency and</text>
    <text x="24" y="340">deployment cost are</text>
    <text x="24" y="358">rarely measured</text>
    <text x="24" y="376">together on the device</text>

    <rect x="200" y="278" width="172" height="126" rx="3" fill="#f7f8fa" stroke="#9aa4b0" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="212" y="300" font-size="13" font-weight="bold" fill="#b5541c">GAP</text>
    <text x="212" y="322">Distance accuracy is</text>
    <text x="212" y="340">not validated against</text>
    <text x="212" y="358">physical ground truth</text>

    <rect x="388" y="278" width="172" height="126" rx="3" fill="#f7f8fa" stroke="#9aa4b0" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="400" y="300" font-size="13" font-weight="bold" fill="#b5541c">GAP</text>
    <text x="400" y="322">The haptic channel's</text>
    <text x="400" y="340">contribution is not</text>
    <text x="400" y="358">isolated from audio</text>

    <rect x="576" y="278" width="172" height="126" rx="3" fill="#f7f8fa" stroke="#9aa4b0" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="588" y="300" font-size="13" font-weight="bold" fill="#b5541c">GAP</text>
    <text x="588" y="322">Feasibility and</text>
    <text x="588" y="340">usability are blurred</text>
    <text x="588" y="358">when blindfolded</text>
    <text x="588" y="376">participants stand in</text>
  </g>

  <line x1="98" y1="404" x2="98" y2="426" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="286" y1="404" x2="286" y2="426" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="474" y1="404" x2="474" y2="426" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="662" y1="404" x2="662" y2="426" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- objectives -->
  <rect x="12" y="430" width="172" height="66" rx="3" fill="#e6eef7" stroke="#2a5d8f" stroke-width="1.8"/>
  <text x="98" y="458" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a5d8f">Objective 1</text>
  <text x="98" y="480" text-anchor="middle" font-size="14" fill="#3d4753">measured, §4.1</text>

  <rect x="200" y="430" width="172" height="66" rx="3" fill="#e6eef7" stroke="#2a5d8f" stroke-width="1.8"/>
  <text x="286" y="458" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a5d8f">Objective 2</text>
  <text x="286" y="480" text-anchor="middle" font-size="14" fill="#3d4753">measured, §4.2</text>

  <rect x="388" y="430" width="360" height="66" rx="3" fill="#fbeee6" stroke="#b5541c" stroke-width="1.8"/>
  <text x="568" y="458" text-anchor="middle" font-size="16" font-weight="bold" fill="#b5541c">Objective 4</text>
  <text x="568" y="480" text-anchor="middle" font-size="14" fill="#3d4753">designed and approved, not carried out (§1.5)</text>

  <!-- synthesis -->
  <line x1="98" y1="496" x2="98" y2="510" stroke="#3d4753" stroke-width="1.5"/>
  <line x1="286" y1="496" x2="286" y2="510" stroke="#3d4753" stroke-width="1.5"/>
  <line x1="568" y1="496" x2="568" y2="510" stroke="#3d4753" stroke-width="1.5"/>
  <line x1="98" y1="510" x2="568" y2="510" stroke="#3d4753" stroke-width="1.5"/>
  <line x1="380" y1="510" x2="380" y2="524" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="12" y="528" width="736" height="92" rx="3" fill="#eef1f5" stroke="#3d4753" stroke-width="1.5"/>
  <text x="24" y="552" font-size="15" font-weight="bold" fill="#151c25">Synthesis</text>
  <text x="24" y="574" font-size="14" fill="#3d4753">methods behind the design choices (§2.5.5) · where the literature disagrees (§2.5.6)</text>
  <text x="24" y="594" font-size="14" fill="#3d4753">closest systems compared (Table 2.3) · gap mapping (Table 2.2) · conclusion (§2.7)</text>
  <text x="24" y="612" font-size="14" fill="#3d4753">→ the aim of this project (§1.2)</text>

  <text x="12" y="650" font-size="13" fill="#74808e">Objective 3 builds the prototype on which Objective 4 would have run; it closes no gap of its own.</text>
</svg>
